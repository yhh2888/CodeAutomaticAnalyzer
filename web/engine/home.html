<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>CodeAutomaticAnalyzer Web Engine</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #1e2430;
      }
      .wrap {
        width: min(1200px, 92vw);
        margin: 32px auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      .panel {
        background: white;
        border: 1px solid #dde5f0;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
        padding: 18px 20px;
      }
      .controls {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr auto;
        gap: 12px;
        align-items: end;
      }
      select, button {
        font-size: 1rem;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-top: 22px;
      }
      .card {
        background: #f8fafc;
        border: 1px solid #dfe7f1;
        border-left: 5px solid #3b82f6;
        border-radius: 12px;
        padding: 14px;
      }
      .card strong {
        display: block;
        margin-bottom: 8px;
      }
      .card small {
        display: block;
        color: #475569;
      }
      .output {
        margin-top: 22px;
      }
      pre {
        margin: 0;
        background: #0f172a;
        color: #dff6ff;
        padding: 20px;
        border-radius: 12px;
        overflow-x: auto;
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .muted {
        color: #475569;
        margin-top: 8px;
      }
      .badge {
        display: inline-block;
        background: #dbeafe;
        color: #1d4ed8;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 4px 8px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <h1>CodeAutomaticAnalyzer Web Engine</h1>
      </div>

      <div class="panel">
        <form method="get">
          <div class="controls">
            <div>
              <label for="analyzer">Analyzer</label><br />
              <select id="analyzer" name="analyzer">
                {% for key, value in analyzers.items() %}
                  <option value="{{ key }}" {% if key == selected_analyzer %}selected{% endif %}>
                    {{ value.label }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div>
              <label for="mode">Expression Type</label><br />
              <select id="mode" name="mode">
                <option value="together" {% if mode == 'together' %}selected{% endif %}>Together</option>
                <option value="flat" {% if mode == 'flat' %}selected{% endif %}>Flat</option>
                <option value="dict" {% if mode == 'dict' %}selected{% endif %}>Dict</option>
              </select>
            </div>

            <button type="submit">Compile</button>
          </div>
        </form>
      </div>

      <div class="cards">
        {% for key, value in analyzers.items() %}
          <div class="card">
            <span class="badge">{{ value.category }}</span>
            <strong>{{ value.label }}</strong>
            <small>{{ value.description }}</small>
          </div>
        {% endfor %}
      </div>

      <div class="output panel">
        <div class="badge">{{ compiled.analyzer }} / {{ compiled.mode }}</div>
        <div class="muted">{{ compiled.description }}</div>
        <pre>{{ compiled.rendered }}</pre>
      </div>
    </div>
  </body>
</html>
